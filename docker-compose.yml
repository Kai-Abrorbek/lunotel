version: '3.3'

services:
  lunotel-api:
    container_name: 'lunotel-api'
    restart: always
    image: node:20.16.0
    ports:
      - 5001:3001
    volumes:
      - ./:/usr/src/lunotel
    working_dir: /usr/src/lunotel

    networks:
      - monorepo-network

    command: bash -c "npm install && npm run build && npm run start:prod"

  lunotel-batch:
    container_name: 'lunotel-batch'
    restart: always
    image: node:20.16.0
    ports:
      - 5002:3002
    volumes:
      - ./:/usr/src/lunotel
    working_dir: /usr/src/lunotel

    networks:
      - monorepo-network

    command: bash -c "npm install && npm run build && npm run start:prod:batch"

networks:
  monorepo-network:
    driver: bridge
